services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: reliability-api

    ports:
      - "9000:8001"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://reliability_user:reliability_password@postgres:5432/reliability_agent
      GROQ_API_KEY: ${GROQ_API_KEY}


  prometheus:
    image: prom/prometheus:latest
    container_name: reliability-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - api


  grafana:
    container_name: reliability-grafana
    image: grafana/grafana:latest

    depends_on:
      - prometheus

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: "${GRAFANA_SMTP_USER}"
      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${GRAFANA_SMTP_USER}"
      GF_SMTP_FROM_NAME: "Operations Reliability Agent"


  postgres:
    image: postgres:16
    container_name: ops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: reliability_agent
      POSTGRES_USER: reliability_user
      POSTGRES_PASSWORD: reliability_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliability_user -d reliability_agent"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  grafana_data:
  prometheus_data: