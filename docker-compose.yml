services:

  # ==========================================================
  # Backend / Reliability Agent API
  # ==========================================================

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: reliability-api

    ports:
      - "9000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      simulated-api:
        condition: service_started

    environment:
      DATABASE_URL: ${DATABASE_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      PROMETHEUS_URL: http://prometheus:9090
      SIMULATED_API_URL: http://simulated-api:8000

    volumes:
      - ./evaluation:/evaluation:ro


  # ==========================================================
  # Simulated Production API
  # ==========================================================

  simulated-api:
    build:
      context: ./simulated-api
      dockerfile: Dockerfile

    container_name: simulated-api

    ports:
      - "8001:8000"


  # ==========================================================
  # Prometheus
  # ==========================================================

  prometheus:
    image: prom/prometheus:latest

    container_name: reliability-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-admin-api"

    ports:
      - "9090:9090"

    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - api


  # ==========================================================
  # Grafana
  # ==========================================================

  grafana:
    image: grafana/grafana:latest

    container_name: reliability-grafana

    depends_on:
      - prometheus

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER}
      GF_SMTP_FROM_NAME: "Operations Reliability Agent"


  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:16

    container_name: ops-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


# ==========================================================
# Persistent Volumes
# ==========================================================

volumes:
  postgres_data:
  grafana_data:
  prometheus_data: