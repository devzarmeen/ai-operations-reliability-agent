global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "operations-reliability-agent"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "api:8000"

  - job_name: "simulated-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "simulated-api:8000"